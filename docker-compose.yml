# TaskFlow: frontend (Nginx + React), backend (Node API) and PostgreSQL.
# Values come from .env next to this file (copy .env.example to .env).
#
#   docker compose up -d --build
#
# Security:
# - Only the frontend is published, and only on 127.0.0.1 (the server's Nginx forwards to it).
# - Backend and PostgreSQL publish NO ports: nothing outside this server can reach them.
# - PostgreSQL sits on an internal network that only the backend can join.

services:
  db:
    image: postgres:15-alpine
    container_name: taskflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # runs the SQL files once, the first time the database is created
      - ./BACKEND/migrations:/docker-entrypoint-initdb.d:ro
    networks: [db] # no "ports:" on purpose
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./BACKEND
    container_name: taskflow_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      db:
        condition: service_healthy
    networks: [web, db] # no "ports:" on purpose

  frontend:
    build:
      context: ./FRONTEND
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: taskflow_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # localhost only: the server's Nginx forwards taskflow.maslecodes.fun here
      - "127.0.0.1:${APP_PORT:-8005}:80"
    networks: [web]

networks:
  web: {}
  db:
    internal: true # no route to or from the outside world

volumes:
  pgdata:
